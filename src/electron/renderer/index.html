<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Codex Usage HUD</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<section id="compact" class="compact" hidden><span class="compact-drag-region" title="Drag to move"><span class="live-dot"></span></span><button id="expand" class="compact-expand" title="Expand usage HUD"><strong id="compact-quota">Waiting for limits</strong></button></section>
<main id="app">
<header class="titlebar"><h1 class="titlebar-title"><span class="live-dot"></span>CODEX USAGE <small id="plan-badge" class="plan-badge" hidden></small></h1><div class="window-actions">
<button id="theme-toggle" title="Theme: System" aria-label="Theme: System">◐</button><button id="refresh" title="Refresh official usage" aria-label="Refresh official usage">↻</button><button id="pin-toggle" title="Always on Top" aria-label="Always on Top" aria-pressed="false">📌</button><button id="settings-trigger" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-popover">⚙</button><button id="collapse" title="Mini mode" aria-label="Mini mode">◒</button><button id="minimize" title="Minimize" aria-label="Minimize">−</button><button id="hide" title="Hide to system tray" aria-label="Hide to system tray">×</button>
</div></header>
<div id="content-stage" class="content-stage"><div class="updated-line"><span id="source-status">Official</span><small id="updated">· Waiting for official usage</small></div><p id="error" class="error" hidden></p><p id="limit-warning" class="error" hidden></p><div id="limits" class="limits-grid"></div><p id="limits-unavailable" class="muted" hidden>Waiting for official limits</p>
<div class="metrics primary-stats"><article id="today-card" hidden><span>Today</span><strong id="today"></strong></article><article id="month-card" hidden><span>Month to date</span><strong id="month"></strong></article><article id="total-card" hidden><span>Lifetime</span><strong id="total"></strong></article></div>
<div class="metrics secondary-stats"><article id="peak-day-card" hidden><span>Peak Day</span><strong id="peak-day"></strong></article><article id="current-streak-card" hidden><span>Streak</span><strong id="current-streak"></strong></article><article id="longest-streak-card" hidden><span>Longest streak</span><strong id="longest-streak"></strong></article><article id="longest-turn-card" hidden><span>Longest turn</span><strong id="longest-turn"></strong></article><article id="active-days-card" hidden><span>Active Days</span><strong id="active-days"></strong></article></div>
<section id="trend-panel" class="trend-row" hidden><h2>Last 28 Days</h2><div id="daily-trend-chart" class="trend-chart" aria-label="Daily token usage sparkline"></div></section>
<section id="heatmap-panel" class="panel" hidden><div class="panel-title"><h2>Activity</h2><span>Last 6 Months</span></div><div id="heatmap-chart" class="heatmap-chart" aria-label="Daily token activity heatmap"></div></section><p id="credit-info" class="muted" hidden></p></div>
<section id="settings-popover" class="settings-popover" role="dialog" aria-label="Settings" hidden><div class="popover-heading"><strong>Settings</strong><button id="settings-close" aria-label="Close settings">×</button></div><label class="setting-column"><span>Opacity <output id="opacity-value">94%</output></span><input id="opacity" type="range" min="55" max="100" step="1"></label><label class="setting-column"><span>Refresh</span><select id="refresh-interval"><option value="60">1 min</option><option value="300">5 min</option><option value="900">15 min</option><option value="0">Manual</option></select></label><button id="diagnostics-toggle" aria-expanded="false" aria-controls="status-details">Status: Waiting</button><div id="status-details" hidden></div></section></main>
<div id="usage-tooltip" class="usage-tooltip" role="tooltip" hidden></div><script src="../../shared/usageMetrics.js"></script><script src="./analysis.js"></script><script src="./app.js"></script></body></html>
