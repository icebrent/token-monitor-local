<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Codex Usage HUD</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<section id="compact" class="compact" hidden><span class="compact-drag-region" title="Drag to move"><span class="live-dot"></span></span><button id="expand" class="compact-expand" title="Expand usage HUD" aria-label="Expand usage HUD"><span id="compact-quota" class="compact-quotas">Waiting for limits</span></button></section>
<main id="app">
<header class="titlebar"><h1 class="titlebar-title"><span class="live-dot"></span>CODEX USAGE <small id="plan-badge" class="plan-badge" hidden></small></h1><div class="window-actions">
<button id="theme-toggle" title="Theme: System" aria-label="Theme: System"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3Z"/><circle cx="12" cy="12" r="9"/></svg></button><button id="refresh" title="Refresh official usage" aria-label="Refresh official usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><button id="pin-toggle" title="Always on top: On" aria-label="Always on top: On" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg></button><button id="settings-trigger" title="Preferences" aria-label="Preferences" aria-expanded="false" aria-controls="settings-popover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.5 3-2 1.2L4 6l-2 3 2.5 2v2L2 15l2 3 2.5-1.2 2 1.2.5 3h6l.5-3 2-1.2L20 18l2-3-2.5-2v-2L22 9l-2-3-2.5 1.2-2-1.2L15 3Z"/><circle cx="12" cy="12" r="3"/></svg></button><button id="collapse" title="Switch to mini mode" aria-label="Switch to mini mode"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 14h6M7 10h10"/></svg></button><button id="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="hide" title="Close to system tray" aria-label="Close to system tray"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div></header>
<div id="content-stage" class="content-stage"><div class="updated-line"><span id="source-status">Official</span><small id="updated">· Waiting for official usage</small></div><p id="credit-info" class="credit-chip" hidden></p><p id="error" class="error" hidden></p><p id="limit-warning" class="error" hidden></p><div id="limits" class="limits-grid"></div><p id="limits-unavailable" class="muted" hidden>Waiting for official limits</p>
<div id="primary-stats" class="metrics primary-stats" hidden><article id="month-card" hidden><span>Month to date</span><strong id="month"></strong></article><article id="total-card" hidden><span>Lifetime</span><strong id="total"></strong></article></div>
<div class="metrics secondary-stats"><article id="peak-day-card" hidden><span>Peak Day</span><strong id="peak-day"></strong></article><article id="current-streak-card" hidden><span>Streak</span><strong id="current-streak"></strong></article><article id="longest-streak-card" hidden><span>Longest streak</span><strong id="longest-streak"></strong></article><article id="longest-turn-card" hidden><span>Longest turn</span><strong id="longest-turn"></strong></article><article id="active-days-card" hidden><span>Active Days</span><strong id="active-days"></strong></article></div>
<section id="trend-panel" class="trend-row" hidden><h2>Last 28 Days</h2><div id="daily-trend-chart" class="trend-chart" aria-label="Daily token usage sparkline"></div></section>
<section id="heatmap-panel" class="panel" hidden><div class="panel-title"><h2>Activity</h2><span>Last 6 Months</span></div><div id="heatmap-chart" class="heatmap-chart" aria-label="Daily token activity heatmap"></div></section></div>
<section id="settings-popover" class="settings-popover" role="dialog" aria-label="Preferences" hidden><div class="popover-heading"><strong>Preferences</strong><button id="settings-close" title="Close preferences" aria-label="Close preferences"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label class="setting-column"><span>Opacity <output id="opacity-value">94%</output></span><input id="opacity" type="range" min="55" max="100" step="1"></label><label class="setting-column"><span>Refresh</span><select id="refresh-interval"><option value="60">1 min</option><option value="300">5 min</option><option value="900">15 min</option><option value="0">Manual</option></select></label><button id="diagnostics-toggle" aria-expanded="false" aria-controls="status-details">Status: Waiting</button><div id="status-details" hidden></div></section></main>
<div id="usage-tooltip" class="usage-tooltip" role="tooltip" hidden></div><script src="../../shared/usageMetrics.js"></script><script src="./analysis.js"></script><script src="./app.js"></script></body></html>
