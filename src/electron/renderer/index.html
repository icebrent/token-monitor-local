<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Codex Offline Monitor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="compact" class="compact" hidden>
    <div class="compact-drag-region">
      <span class="live-dot"></span>
      <strong id="compact-total">0</strong>
    </div>
    <button id="expand" class="compact-expand" type="button" title="展开完整界面" aria-label="展开完整界面">
      ↗
    </button>
  </section>

  <main id="app">
    <header class="titlebar">
      <div>
        <p class="eyebrow"><span class="live-dot"></span> LOCAL ONLY</p>
        <h1>Codex Token Monitor</h1>
      </div>
      <div class="window-actions">
        <button id="collapse" type="button" title="收起为悬浮窗">◒</button>
        <button id="minimize" type="button" title="最小化">—</button>
        <button id="hide" type="button" title="隐藏到托盘">×</button>
      </div>
    </header>

    <section class="view-controls">
      <label class="view-selector">
        <select id="view-select" aria-label="主页面">
          <option value="overview">总览</option>
          <option value="analysis">分析</option>
        </select>
      </label>
      <nav id="overview-tabs" class="secondary-tabs period-tabs" aria-label="统计周期">
        <button class="period active" data-period="today" type="button">今天</button>
        <button class="period" data-period="month" type="button">本月</button>
        <button class="period" data-period="allTime" type="button">全部</button>
      </nav>
      <nav id="analysis-tabs" class="secondary-tabs analysis-tabs" aria-label="分析维度" hidden>
        <button class="analysis-tab active" data-analysis="overview" type="button">概览</button>
        <button class="analysis-tab" data-analysis="models" type="button">模型</button>
        <button class="analysis-tab" data-analysis="projects" type="button">项目</button>
        <button class="analysis-tab" data-analysis="dates" type="button">日期</button>
      </nav>
    </section>

    <div id="content-stage" class="content-stage">
      <p id="error" class="error" hidden></p>

      <section id="summary-view">
        <div class="hero">
          <span>总 token</span>
          <div class="total-line">
            <strong id="total">0</strong>
            <em id="total-delta" class="total-delta" hidden>+0</em>
          </div>
          <small id="updated">等待本地日志</small>
        </div>
        <div class="metrics">
          <article><span>输入</span><strong id="input">0</strong></article>
          <article><span>缓存输入</span><strong id="cached">0</strong></article>
          <article><span>输出</span><strong id="output">0</strong></article>
          <article><span>推理</span><strong id="reasoning">0</strong></article>
          <article><span>会话</span><strong id="sessions">0</strong></article>
          <article><span>模型</span><strong id="models-count">0</strong></article>
        </div>
        <section class="panel">
          <div class="panel-title"><h2>模型</h2><span id="model-period"></span></div>
          <div id="models" class="model-list"></div>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>最近会话</h2></div>
          <div id="recent-sessions" class="session-list"></div>
        </section>
      </section>

      <section id="analysis-view" class="analysis-view" hidden>
        <section id="analysis-overview">
          <section class="panel">
            <div class="panel-title"><h2>活跃热力图</h2><span>滚动一年</span></div>
            <div id="heatmap-scroll" class="heatmap-scroll">
              <div id="heatmap-chart" class="heatmap-chart" aria-label="每日 token 活跃热力图"></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title"><h2>历史概览</h2></div>
            <div class="metrics analysis-metrics">
              <article><span>活跃日</span><strong id="active-days">0</strong></article>
              <article><span>当前连续</span><strong id="current-streak">0</strong></article>
              <article><span>最长连续</span><strong id="longest-streak">0</strong></article>
              <article><span>峰值日</span><strong id="peak-day">0</strong></article>
              <article><span>消息数</span><strong id="history-messages">0</strong></article>
              <article><span>常用模型</span><strong id="favorite-model">—</strong></article>
            </div>
          </section>
        </section>

        <section id="analysis-models" hidden>
          <section class="panel">
            <div class="panel-title"><h2>模型汇总</h2><span>全部时间</span></div>
            <div id="analysis-model-list" class="analysis-list"></div>
          </section>
        </section>

        <section id="analysis-projects" hidden>
          <section class="panel">
            <div class="panel-title"><h2>项目汇总</h2><span>全部时间</span></div>
            <div id="analysis-project-list" class="analysis-list"></div>
          </section>
        </section>

        <section id="analysis-dates" hidden>
          <section class="panel trend-panel">
            <div class="panel-title"><h2>每日趋势</h2><span>最近 28 个活跃日</span></div>
            <div id="daily-trend-chart" class="trend-chart" aria-label="每日 token 趋势图"></div>
          </section>
          <section class="panel">
            <div class="panel-title"><h2>月度汇总</h2></div>
            <div id="monthly-list" class="analysis-list"></div>
          </section>
        </section>
      </section>
    </div>

    <button id="settings-trigger" class="settings-trigger" type="button" aria-expanded="false" aria-controls="settings-sheet">
      <span aria-hidden="true">⌃</span>
      本地设置与导出
    </button>

    <footer>
      <span>无账号 · 无凭证 · 无网络</span>
      <button id="refresh" type="button">刷新</button>
    </footer>

    <button id="settings-backdrop" class="settings-backdrop" type="button" aria-label="关闭本地设置与导出" hidden></button>
    <section id="settings-sheet" class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <button id="settings-close" class="settings-close" type="button">
        <span aria-hidden="true">⌄</span>
        <span id="settings-title">本地设置与导出</span>
      </button>
      <div class="settings-body">
        <label class="setting-row">
          <span>始终置顶</span>
          <input id="always-on-top" type="checkbox">
        </label>
        <label class="setting-column">
          <span>窗口透明度 <output id="opacity-value">94%</output></span>
          <input id="opacity" type="range" min="55" max="100" step="1">
        </label>
        <label class="setting-column">
          <span>主题</span>
          <select id="theme">
            <option value="system">跟随系统</option>
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </label>
        <div class="export-actions">
          <button id="choose-export" type="button">选择导出目录</button>
          <button id="export-now" type="button">导出 JSON / CSV</button>
          <button id="open-export" type="button">打开导出目录</button>
          <button id="open-user-data" type="button">打开应用数据目录</button>
        </div>
        <p id="export-status" class="muted">尚未选择导出目录</p>
      </div>
    </section>
  </main>
  <script src="./modelRows.js"></script>
  <script src="./analysis.js"></script>
  <script src="./tokenTransition.js"></script>
  <script src="./app.js"></script>
</body>
</html>
